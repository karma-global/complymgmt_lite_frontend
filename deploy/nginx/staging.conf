# Staging: http://complymgmt-lite.staging.kmc.com on the shared staging server (on-prem, internal DNS).
# One site of several: each app has its own file in /etc/nginx/conf.d/ and its own <app>.staging.kmc.com
# name, and 00-default.conf turns away names no site claims (see "Multi-site staging" in the README).
#   /       the built files of the release the pipeline last activated (no Node process)
#   /api/   the backend on 127.0.0.1:9001, prefix stripped, so the browser talks to one origin
#           and the backend needs no CORS entry (build with VITE_API_BASE_URL=/api)
#
# Install on the staging server (Rocky Linux):
#   sudo cp deploy/nginx/staging.conf /etc/nginx/conf.d/complymgmt-lite.conf
#   sudo setsebool -P httpd_can_network_connect 1    # SELinux: let nginx reach the backend port
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name complymgmt-lite.staging.kmc.com;

    root /var/www/complymgmt_lite/current;
    index index.html;

    # The trailing slash on proxy_pass replaces the leading "/api/" with "/". The app adds "/api" in
    # front of its own paths, so the browser's /api/api/v1/login reaches the backend as /api/v1/login
    # and /api/view_all_roles as /view_all_roles.
    location /api/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above the backend's own 50 MB body limit, so an oversized upload gets its JSON error
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # Vite fingerprints everything under /assets, so it can be cached for good
    location /assets/ {
        try_files $uri @previous_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A tab opened before the last deploy still asks for the old release's lazy chunks
    location @previous_assets {
        root /var/www/complymgmt_lite/previous;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Must never be cached: they decide which release a browser (and the health check) gets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # BrowserRouter: unknown paths load the app, which routes on the client
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# HTTPS, once the internal CA has issued the shared wildcard certificate for *.staging.kmc.com (one
# certificate for every staging site; a wildcard covers one level, hence <app>.staging.kmc.com). Then:
#   - uncomment this block and the redirect below,
#   - set the staging APP_URL to https://complymgmt-lite.staging.kmc.com,
#   - make sure the staging server itself trusts the internal CA (the health check uses curl there):
#       sudo cp internal-ca.crt /etc/pki/ca-trust/source/anchors/ && sudo update-ca-trust
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name complymgmt-lite.staging.kmc.com;
#     ssl_certificate     /etc/pki/tls/certs/staging.kmc.com.crt;
#     ssl_certificate_key /etc/pki/tls/private/staging.kmc.com.key;
#
#     # ...same root and location blocks as the port 80 server above...
# }
#
# And in the port 80 server, replace the location blocks with:
#     return 301 https://complymgmt-lite.staging.kmc.com$request_uri;
