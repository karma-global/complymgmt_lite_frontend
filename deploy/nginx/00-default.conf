# Catch-all for the shared staging server: a request for a name no site claims (a typo, a raw IP, a
# DNS record pointed here before its site exists) gets the connection closed, instead of nginx
# handing it to whichever site happens to load first. Installed once per server, not per app:
#   sudo cp deploy/nginx/00-default.conf /etc/nginx/conf.d/00-default.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

